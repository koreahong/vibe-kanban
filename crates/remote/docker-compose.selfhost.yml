# Self-hosting: all-in-one stack for running vibe-kanban without external services.
# Usage:
#   cp .env.selfhost.example .env.selfhost
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up --build -d
services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: vibekanban
      POSTGRES_USER: vibekanban
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vibekanban}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibekanban -d vibekanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose --skipApiVersionCheck"
    volumes:
      - ./data/azurite:/data
    healthcheck:
      test: nc 127.0.0.1 10000 -z
      interval: 1s
      retries: 30

  azurite-init:
    image: mcr.microsoft.com/azure-cli:latest
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        az storage container create --name issue-attachments 2>/dev/null || true
        az storage cors add --services b --methods GET PUT POST DELETE OPTIONS --origins '*' --allowed-headers '*' --exposed-headers '*' --max-age 3600

  electric:
    image: electricsql/electric:1.4.13
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://electric_sync:${ELECTRIC_ROLE_PASSWORD:-vibekanban}@db:5432/vibekanban?sslmode=disable
      AUTH_MODE: insecure
      ELECTRIC_INSECURE: true
      ELECTRIC_MANUAL_TABLE_PUBLISHING: true
      ELECTRIC_USAGE_REPORTING: false
      ELECTRIC_FEATURE_FLAGS: allow_subqueries,tagged_subqueries
    volumes:
      - ./data/electric:/app/persistent
    depends_on:
      db:
        condition: service_healthy
      remote-server:
        condition: service_healthy

  remote-server:
    build:
      context: ../..
      dockerfile: crates/remote/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      azurite-init:
        condition: service_completed_successfully
    environment:
      RUST_LOG: info,remote=info
      SERVER_DATABASE_URL: postgres://vibekanban:${DB_PASSWORD:-vibekanban}@db:5432/vibekanban
      SERVER_LISTEN_ADDR: 0.0.0.0:8081
      ELECTRIC_URL: http://electric:3000
      ELECTRIC_ROLE_PASSWORD: ${ELECTRIC_ROLE_PASSWORD:-vibekanban}
      VIBEKANBAN_REMOTE_JWT_SECRET: "${VIBEKANBAN_REMOTE_JWT_SECRET:?Generate with: openssl rand -base64 48}"
      VIBEKANBAN_DEV_AUTH: ${VIBEKANBAN_DEV_AUTH:-false}
      SERVER_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # OAuth (optional if dev auth is enabled)
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Keycloak OIDC (optional)
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      # Azure Blob (Azurite for local)
      AZURE_STORAGE_ACCOUNT_NAME: devstoreaccount1
      AZURE_STORAGE_ACCOUNT_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      AZURE_STORAGE_CONTAINER_NAME: issue-attachments
      AZURE_STORAGE_ENDPOINT_URL: http://azurite:10000/devstoreaccount1
      AZURE_STORAGE_PUBLIC_ENDPOINT_URL: ${PUBLIC_BASE_URL:-http://localhost}:10000/devstoreaccount1
    ports:
      - "0.0.0.0:3000:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  relay-server:
    build:
      context: ../..
      dockerfile: crates/relay-tunnel/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      RUST_LOG: info
      SERVER_DATABASE_URL: postgres://vibekanban:${DB_PASSWORD:-vibekanban}@db:5432/vibekanban
      RELAY_LISTEN_ADDR: 0.0.0.0:8082
      VIBEKANBAN_REMOTE_JWT_SECRET: "${VIBEKANBAN_REMOTE_JWT_SECRET:?Generate with: openssl rand -base64 48}"
    ports:
      - "0.0.0.0:8082:8082"
    restart: unless-stopped

# Data volumes use bind mounts (./data/) for safe persistence across docker volume rm operations
# Run: mkdir -p data/postgres data/electric data/azurite before first start
